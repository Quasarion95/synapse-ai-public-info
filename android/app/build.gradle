plugins { id 'com.android.application' }

/* Ключи аналитики — в файле вне репозитория, как и подпись.

   ~/.synapse-ops/analytics.properties:
     tracerAppToken=…     ключ приложения в Tracer (отчёты о падениях)
     tracerPluginToken=…  ключ загрузки сборок в Tracer
     mytrackerKey=…       SDK-ключ приложения в MyTracker

   Нет файла или ключа — сборка всё равно собирается, просто без этой части:
   отладочные сборки и чужие компьютеры ничего никуда не шлют. */
def аналитика = new Properties()
def файлАналитики = new File(System.getProperty('user.home'), '.synapse-ops/analytics.properties')
if (файлАналитики.exists()) файлАналитики.withReader('UTF-8') { аналитика.load(it) }
def tracerВключён = аналитика['tracerAppToken'] && аналитика['tracerPluginToken']
if (tracerВключён) {
    apply plugin: 'ru.ok.tracer'
    tracer {
        defaultConfig {
            pluginToken = аналитика['tracerPluginToken']
            appToken = аналитика['tracerAppToken']
            // Код не сжимается (minifyEnabled false) — загружать нечего.
            uploadMapping = false
        }
    }
}

android {
    namespace 'ru.synapseapp.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.synapseapp.app'
        minSdk 24            // Android 7: ниже WebView слишком стар для нашего JS
        targetSdk 34
        versionCode 11
        versionName '2.1'
        buildConfigField 'String', 'MYTRACKER_KEY', '"' + (аналитика['mytrackerKey'] ?: '') + '"'
    }

    buildFeatures { buildConfig true }

    /* Файлы веб-версии не лежат в репозитории дважды.

       Копия внутри android/ рано или поздно отстала бы от app/ — ровно та
       поломка, из-за которой мы и держим всё в одном репозитории. Поэтому
       assets не хранятся, а собираются из app/ при каждой сборке. */
    sourceSets {
        main { assets.srcDirs = ['build/webapp'] }
    }

    /* Подпись читается из файла вне репозитория.

       Ключ подписи — это право выпускать обновления от вашего имени, и он
       единственный: потеряете — обновить приложение в магазине будет уже
       нельзя, только выкладывать заново под новым именем, потеряв всех
       установивших. Поэтому он лежит в ~/.synapse-ops рядом с остальными
       ключами и в репозиторий не попадает никогда. */
    signingConfigs {
        release {
            def файл = new File(System.getProperty('user.home'), '.synapse-ops/android-signing.properties')
            if (файл.exists()) {
                def свойства = new Properties()
                // Читаем как UTF-8: Properties.load из потока понимает только
                // Latin-1, и путь к ключу с русскими буквами («ОЧЕНЬ ВАЖНО»)
                // превращался в кракозябры — сборка не находила файл.
                файл.withReader('UTF-8') { свойства.load(it) }
                storeFile file(свойства['storeFile'])
                storePassword свойства['storePassword']
                keyAlias свойства['keyAlias']
                // Пароль ключа почти всегда тот же, что у хранилища, — тогда
                // его можно не дублировать в файле.
                keyPassword свойства['keyPassword'] ?: свойства['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false      // Кода на Java здесь на один экран
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

/* Kotlin в сборке ровно одной версии.

   Мы не пишем на Kotlin ни строчки, но androidx тянет его за собой, и разные
   библиотеки просят разные версии: kotlin-stdlib 1.8.22 и отдельные
   kotlin-stdlib-jdk7/jdk8 1.6.21. Начиная с 1.8 содержимое jdk7 и jdk8 вошло
   в основной stdlib — старые артефакты дают ровно те же классы второй раз, и
   сборка падает на дубликатах. Выкидываем старые, версию основного
   фиксируем. */
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'   // ради WebViewAssetLoader
    implementation 'androidx.activity:activity:1.9.2'
    // Custom Tabs: оплата открывается вкладкой поверх приложения — с адресом и
    // замком в строке, но без выхода из Synapse. См. MainActivity.открытьСнаружи.
    implementation 'androidx.browser:browser:1.8.0'
    /* Сканер QR для связки устройств. ZXing, а не сканер из сервисов Google:
       ему не нужны Google Play services, и он работает и там, где их нет, —
       на Huawei и телефонах без Google, которых в RuStore немало. Камера
       спрашивается его же окном при первом нажатии «Сканировать QR». */
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    /* RuStore: оценка внутри приложения и обновление без похода в магазин.
       Редакция RuStore смотрит, встроены ли они, когда отбирает приложения в
       подборки, а оценка в один тап собирает отзывы, по которым считаются топы. */
    implementation 'ru.rustore.sdk:review:6.0.0'
    implementation 'ru.rustore.sdk:appupdate:7.0.0'
    // Tracer — только вместе с ключами: без них библиотека не находит
    // настроек, которые генерирует плагин, и падала бы на старте.
    if (tracerВключён) implementation 'ru.ok.tracer:tracer-crash-report:1.5.1'
    // MyTracker: откуда приходят люди и возвращаются ли. Только события
    // по названию («закрыл задачу»), без текста задач, целей и сумм.
    implementation 'com.my.tracker:mytracker-sdk:3.6.0'
}

/* Забираем веб-версию перед сборкой.

   Исключаем sw.js и манифест: внутри apk файлы уже локальные, второй слой
   кэша service worker только спорил бы с первым и отдавал вчерашнюю версию —
   тот самый класс ошибок, что мы ловили в вебе весь день. */
tasks.register('копияВебВерсии', Copy) {
    from rootProject.file('../app')
    into layout.buildDirectory.dir('webapp/app')
    exclude 'sw.js'
    /* web/ едет в апк целиком. Раньше его исключали как «только веб», но
       index.html грузит оттуда и в приложении: цветовую систему (theme.js и
       theme.css), оформление заметок (notes-edit) и живое дерево карты целей
       (goal-tree). Без них темы и заметки в апк тихо ломались — файлы
       отвечали 404. Остальное из web/ index.html внутри обёртки не
       подключает, а вес у него небольшой. */
    exclude '_android_test.html'
}

tasks.register('копияШрифтов', Copy) {
    from rootProject.file('../fonts')
    into layout.buildDirectory.dir('webapp/fonts')
}

/* Копирование цепляем к preBuild, а не к сборке assets.

   Цеплять к generate*Assets было мало: релизная сборка ещё запускает проверку
   кода, которая читает ту же папку и про наши задачи не знает — Gradle честно
   отказался собирать, не зная порядка. preBuild идёт раньше вообще всего, и
   вопрос порядка снимается для всех, кто заглянет в эту папку потом. */
tasks.named('preBuild') {
    dependsOn 'копияВебВерсии', 'копияШрифтов'
}
