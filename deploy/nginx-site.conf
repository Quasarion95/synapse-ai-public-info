# Сайт synapseapp.ru прямо с московского сервера, мимо Cloudflare.
#
# Зачем: у домашних провайдеров в России Cloudflare режут — сначала по ECH,
# а после его отключения выяснилось, что и целиком. Сайт не открывался без
# VPN, то есть витрина и оплата были недоступны тем, для кого сделаны.
# Российский IP этого сервера не фильтруется никем.
#
#   scp deploy/nginx-site.conf root@<ip>:/etc/nginx/sites-available/synapse-site
#   ssh root@<ip> 'ln -sf /etc/nginx/sites-available/synapse-site /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx'

server {
    listen 80;
    listen [::]:80;
    server_name synapseapp.ru www.synapseapp.ru;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://synapseapp.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.synapseapp.ru;

    ssl_certificate     /etc/letsencrypt/live/synapseapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapseapp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://synapseapp.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name synapseapp.ru new.synapseapp.ru;

    ssl_certificate     /etc/letsencrypt/live/synapseapp.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapseapp.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /var/www/synapseapp;
    index index.html;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 1024;

    # Тот же вид адресов, что отдавал GitHub Pages: /privacy/ — это папка с
    # index.html, а /privacy — тот же адрес со слэшем. Без этого половина
    # ссылок на сайте и в приложении отдавала бы 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Код веб-версии обязан приезжать свежим: service worker кладёт в кэш то,
    # что отдал сервер, и старый ответ пережил бы саму выкатку.
    location ~* \.(js|css|html|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        # Повтор защитных заголовков не случаен: add_header внутри location
        # ОТМЕНЯЕТ унаследованные с уровня server. Каждая страница сайта
        # отдаётся внутренним переходом в html-location, и до этой правки
        # HSTS и nosniff не доходили ни до одной страницы.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(woff2|png|jpg|jpeg|svg|ico|mp3)$ {
        add_header Cache-Control "public, max-age=604800";
        # Повтор защитных заголовков не случаен: add_header внутри location
        # ОТМЕНЯЕТ унаследованные с уровня server. Каждая страница сайта
        # отдаётся внутренним переходом в html-location, и до этой правки
        # HSTS и nosniff не доходили ни до одной страницы.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
