<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Synapse — система планирования и достижения целей</title>
    <meta name="description" content="Цели, этапы, задачи, деньги и ассистент — в одном контуре. Записи хранятся в этом браузере.">
    <!-- Начертания «Rounded» и «Clean» опирались только на системные шрифты
         Apple. На айфоне они разные, на андроиде оба падали в Roboto —
         человек жал кнопки, и ничего не менялось. Manrope и Inter лежат
         в репозитории с кириллицей и работают везде одинаково. -->
    <link rel="preload" as="font" type="font/woff2" href="../fonts/Manrope-cyrillic.woff2" crossorigin>
    <link rel="stylesheet" href="../fonts/fonts.css">
    <link rel="stylesheet" href="app.css">
    <!-- Часть только веб-версии: финансы одним экраном на широком окне,
         живой фон медитации, убывающее время помодоро, карта целей
         во всю область и раскладка широкого окна с меню у левого края.
         Внутри андроид-обёртки не подключается (признак — AndroidVoice, как у
         счётчика ниже). См. web/README.md. -->
    <script>
      if (!window.AndroidVoice) document.write(
        '<link rel="stylesheet" href="web/desk.css">' +
        '<link rel="stylesheet" href="web/finance-desk.css">' +
        '<link rel="stylesheet" href="web/meditation-scenes.css">' +
        '<link rel="stylesheet" href="web/pomodoro-timer.css">' +
        '<link rel="stylesheet" href="web/goal-map.css">' +
        '<link rel="stylesheet" href="web/layout.css">' +
        '<link rel="stylesheet" href="web/subscription.css">' +
        '<link rel="stylesheet" href="web/profile.css">' +
        '<link rel="stylesheet" href="web/lists-notes.css">' +
        '<link rel="stylesheet" href="web/theme.css">');
    </script>

    <!-- Ставится ярлыком на домашний экран и открывается без сети: записи и
         так лежат в браузере, из сети приходила только оболочка. -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=e57f66bb">
    <link rel="icon" href="icons/icon-192.png?v=53921953" sizes="192x192" type="image/png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Synapse">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Цвет строки браузера подстраивается под тему: светлый и тёмный фон
         палитры «Бумага» из AppTheme. -->
    <meta name="theme-color" content="#F6F2E7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1C1F1A" media="(prefers-color-scheme: dark)">

    <!-- Яндекс.Метрика в веб-версии.

         Два отличия от счётчика на страницах сайта, и оба намеренные.

         1. Вебвизор ВЫКЛЮЧЕН. На сайте он пишет экран посетителя — там читать
            нечего, обычные страницы. Здесь на экране лежат чужие задачи,
            заметки и деньги. Запись такого экрана противоречила бы тому, что
            мы обещаем прямым текстом: записи человека остаются у него, мы их
            не видим. Ни один отчёт этого не стоит.

         2. Внутри андроид-приложения счётчик не запускается. Апк — это та же
            веб-версия в обёртке, и без проверки трекер уехал бы в приложение,
            где мы обещали, что его нет. Признак — объект AndroidVoice, который
            обёртка вставляет в страницу.

         Считаем только посещения и переходы по экранам: сколько людей открыло,
         откуда пришли, где закрыли. Ни строчки того, что человек написал. -->
    <script>
      if (!window.AndroidVoice) {
        (function(m,e,t,r,i,k,a){
          m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
          m[i].l=1*new Date();
          for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
          k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111833170', 'ym');

        ym(111833170, 'init', {
          ssr: true,
          webvisor: false,
          clickmap: false,
          trackLinks: true,
          accurateTrackBounce: true,
          referrer: document.referrer,
          url: location.href
        });
      }
    </script>
    <script>
      /* Партнёрский код может прийти прямо на /app/?promo=КОД (в т.ч. когда так
         открыта вебка приложения). Закрепляем в тот же localStorage, что читает
         страница оплаты (synapse.promo — как на главной), и чистим адрес. */
      (function(){
        try{
          var raw = new URLSearchParams(location.search).get("promo");
          if(!raw) return;
          var code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,24);
          if(code){ localStorage.setItem("synapse.promo", JSON.stringify({ code: code, at: Date.now() })); }
          var p = new URLSearchParams(location.search); p.delete("promo");
          var qs = p.toString();
          if(window.history && window.history.replaceState){
            window.history.replaceState({}, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
          }
        }catch(e){}
      })();
    </script>
  </head>
  <body>
    <!--
      Каркас намеренно пустой: шапку, экран и таб-бар рисует app.js строками,
      как в прототипе «Дедлайна». Здесь только три контейнера и модалка.
    -->
    <header class="top" id="top"></header>
    <main id="app"></main>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-in" id="modalIn"></div></div>

    <script src="i18n.js"></script>
    <script src="sync-crypto.js"></script>
    <script src="sync-bridge.js"></script>
    <!-- До app.js, а не после: первая отрисовка должна уже знать про дашборд,
         иначе на широком экране на миг мелькают вкладки. -->
    <script>
      if (!window.AndroidVoice) document.write(
        '<script src="web/mobile-app.js"><\/script>' +
        '<script src="web/theme.js"><\/script>' +
        '<script src="web/subscription.js"><\/script>' +
        '<script src="web/profile.js"><\/script>' +
        '<script src="web/lists-notes.js"><\/script>' +
        '<script src="web/i18n-web.js"><\/script>' +
        '<script src="web/desk.js"><\/script>' +
        '<script src="web/finance-desk.js"><\/script>' +
        '<script src="web/meditation-scenes.js"><\/script>' +
        '<script src="web/pomodoro-timer.js"><\/script>' +
        '<script src="web/goal-map.js"><\/script>' +
        '<script src="web/layout.js"><\/script>');
    </script>
    <script src="app.js"></script>
  </body>
</html>
