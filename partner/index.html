<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Кабинет партнёра переехал — Synapse</title>
    <meta name="robots" content="noindex">
    <link rel="canonical" href="https://synapseapp.ru/me/">
    <!-- Кабинет партнёра живёт на /me/. Эта страница только переводит туда,
         сохраняя адресную строку целиком: ключ приходит параметром ?key=…, и
         без него партнёру пришлось бы вводить ключ заново.

         Скрипт стоит раньше meta refresh и уводит сразу. Сам refresh спрятан в
         noscript: без скрипта он переносит на /me/ без параметров — ключ
         тогда вводится руками, но страница не тупиковая. -->
    <script>
      location.replace("../me/" + location.search + location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=../me/"></noscript>
    <link rel="icon" href="../screens/mark.png?v=18ab930c">
    <link rel="stylesheet" href="../site.css">
    <link rel="stylesheet" href="../site-theme.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1>Кабинет партнёра переехал</h1>
        <p class="lead">
          Теперь он по адресу <a href="../me/">synapseapp.ru/me/</a>.
          Если страница не открылась сама, нажмите на ссылку.
        </p>
      </section>
    </main>
  </body>
</html>
