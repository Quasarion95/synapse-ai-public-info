name: Backend keep-alive

# Lives in this public repository on purpose. Render's free tier spins a service
# down after ~15 minutes idle, so it needs a request more often than that — but
# GitHub only grants 2000 Actions minutes/month to private repositories, and a
# 10-minute ping costs ~4320 (every run bills at least a full minute). The
# private repo burned through its quota mid-month, Actions stopped, and the
# backend went back to sleeping. Public repositories get unlimited standard
# runner minutes, so the same job costs nothing here.
#
# Only a public health URL is involved — no secrets, nothing this repo doesn't
# already expose.

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler is best-effort and can run late under
    # load, so the interval is set well below Render's ~15-minute idle window
    # rather than right at it.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: backend-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /healthz
        run: |
          for attempt in 1 2 3; do
            # A sleeping instance answers the first request only after it has
            # finished waking, which can take most of a minute — hence the
            # generous timeout and the retries.
            if curl -fsS --max-time 90 https://synapse-backend-free.onrender.com/healthz; then
              echo ""
              echo "awake (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt failed; retrying"
            sleep 15
          done
          echo "backend did not respond after 3 attempts"
          exit 1
